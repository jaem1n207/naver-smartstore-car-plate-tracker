name: Production Deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      privileged_maintenance_required: ${{ steps.deployment_scope.outputs.privileged_maintenance_required }}
    steps:
      - name: Reject non-main manual ref
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Manual production deployment is restricted to main."
          exit 1

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify privileged deployment changes
        id: deployment_scope
        env:
          CURRENT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          privileged_maintenance_required=false

          if [[ "${EVENT_NAME}" == push ]]; then
            if [[ ! "${CURRENT_SHA}" =~ ^[0-9a-f]{40}$ || ! "${GH_REPOSITORY}" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ || -z "${GH_TOKEN}" ]]; then
              echo "::error::Cannot establish the trusted production revision."
              exit 1
            fi

            if ! successful_runs="$(
              gh api --method GET \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GH_REPOSITORY}/actions/workflows/deploy-production.yml/runs?status=success&branch=main&per_page=100"
            )"; then
              echo "::error::Cannot read the last successful production deployment."
              exit 1
            fi

            if ! trusted_production_sha="$(
              jq -er '
                [.workflow_runs[]
                  | select(.event == "push" or .event == "workflow_dispatch")
                  | .head_sha]
                | first
                | select(type == "string")
              ' <<<"${successful_runs}"
            )" || [[ ! "${trusted_production_sha}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Cannot identify the last successful production revision."
              exit 1
            fi

            if ! git cat-file -e "${trusted_production_sha}^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags --depth=1 origin "${trusted_production_sha}"; then
                echo "::error::Cannot fetch the last successful production revision."
                exit 1
              fi
            fi
            if ! git diff --quiet "${trusted_production_sha}" "${CURRENT_SHA}" -- ops/deployment; then
              privileged_maintenance_required=true
            fi
          fi

          printf 'privileged_maintenance_required=%s\n' \
            "${privileged_maintenance_required}" >>"${GITHUB_OUTPUT}"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate shell syntax
        run: bash -n ops/deployment/*.sh ops/deployment/lib/*.sh

      - name: Install pinned static analyzers
        run: |
          set -Eeuo pipefail
          tools_directory="${RUNNER_TEMP}/static-tools"
          actionlint_archive="${RUNNER_TEMP}/actionlint_1.7.7_linux_amd64.tar.gz"
          shellcheck_archive="${RUNNER_TEMP}/shellcheck-v0.10.0.linux.x86_64.tar.xz"
          install -d -m 0755 "${tools_directory}"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            --output "${actionlint_archive}"
          printf '%s  %s\n' \
            023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757 \
            "${actionlint_archive}" | sha256sum --check
          tar --extract --gzip --file="${actionlint_archive}" --directory="${tools_directory}" actionlint

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz \
            --output "${shellcheck_archive}"
          printf '%s  %s\n' \
            6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87 \
            "${shellcheck_archive}" | sha256sum --check
          tar --extract --xz --file="${shellcheck_archive}" --directory="${tools_directory}" \
            --strip-components=1 shellcheck-v0.10.0/shellcheck
          chmod 0555 "${tools_directory}/actionlint" "${tools_directory}/shellcheck"

      - name: Run actionlint
        run: '"${RUNNER_TEMP}/static-tools/actionlint"'

      - name: Run shellcheck
        run: >-
          find ops/deployment -type f -name '*.sh' -print0 |
          sort --zero-terminated |
          xargs --null "${RUNNER_TEMP}/static-tools/shellcheck"

      - name: Run complete test suite
        run: pnpm test:all

      - name: Build production JavaScript
        run: pnpm build

      - name: Verify generated visual CSS
        run: git diff --exit-code -- tests/visual/fixtures/sheets-view.css

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-diagnostics-${{ runner.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy production
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Require reviewed privileged maintenance
        if: github.event_name == 'push' && needs.verify.outputs.privileged_maintenance_required == 'true'
        run: |
          set -Eeuo pipefail
          echo "::error title=Privileged maintenance required::This revision changes ops/deployment. Install the reviewed root-owned deployment assets on Oracle, then run this workflow manually from main with workflow_dispatch."
          {
            echo "## Privileged maintenance required"
            echo
            echo "This main revision changes root-owned deployment assets under \`ops/deployment\`."
            echo "Routine deployment cannot install those files by design."
            echo "Complete the reviewed Oracle maintenance procedure, then rerun this workflow from \`main\` with \`workflow_dispatch\`."
          } >>"${GITHUB_STEP_SUMMARY}"
          exit 1

      - name: Request production deployment
        env:
          DEPLOY_HOST: ${{ secrets.OCI_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.OCI_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.OCI_DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.OCI_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail

          if [[ "${DEPLOY_USER}" != carplate-deploy || ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Deployment identity or revision is invalid."
            exit 1
          fi
          if [[ -z "${DEPLOY_HOST}" || -z "${DEPLOY_KEY}" || -z "${DEPLOY_KNOWN_HOSTS}" ]]; then
            echo "::error::Production deployment credentials are incomplete."
            exit 1
          fi

          ssh_directory="${RUNNER_TEMP}/deploy-ssh"
          key_file="${ssh_directory}/deploy-key"
          known_hosts_file="${ssh_directory}/known-hosts"
          install -d -m 0700 "${ssh_directory}"
          trap 'rm -f "${key_file}" "${known_hosts_file}"' EXIT
          umask 077
          printf '%s\n' "${DEPLOY_KEY}" >"${key_file}"
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" >"${known_hosts_file}"
          chmod 0600 "${key_file}" "${known_hosts_file}"

          set +e
          result="$(
            timeout 110m ssh \
              -i "${key_file}" \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="${known_hosts_file}" \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=6 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "deploy ${GITHUB_SHA}" 2>/dev/null
          )"
          status=$?
          set -e

          if [[ "${result}" == *$'\n'* ]]; then
            echo "::error::Deployment returned an invalid response."
            exit 1
          fi

          if ! sanitized_result="$(
            printf '%s' "${result}" | jq -ce '
              if (
                type == "object" and
                keys == ["activatedSha", "diagnosticId", "outcome", "previousSha", "requestedSha"] and
                all(.[]; type == "string")
              ) then
                {outcome, requestedSha, previousSha, activatedSha, diagnosticId}
              else
                error("invalid deployment response")
              end
            ' 2>/dev/null
          )"; then
            echo "::error::Deployment returned an invalid response."
            exit 1
          fi

          deployment_outcome="$(jq -r .outcome <<<"${sanitized_result}")"
          if [[ "${deployment_outcome}" == privileged_maintenance_required ]]; then
            status=1
            echo "::error title=Privileged maintenance required::The reviewed root-owned deployment assets do not match this main revision. Run the documented Oracle privileged maintenance procedure for this exact SHA, then dispatch this workflow again from main."
            {
              echo "## Privileged maintenance required"
              echo
              echo "The Oracle server rejected deployment before stopping the scheduler or building a candidate."
              printf 'Its reviewed root-owned deployment assets do not match commit %s.\n' "${GITHUB_SHA}"
              echo "Run the documented privileged maintenance procedure for this exact SHA, then rerun this workflow from main with workflow_dispatch."
            } >>"${GITHUB_STEP_SUMMARY}"
          fi

          printf '%s\n' "${sanitized_result}"
          exit "${status}"
